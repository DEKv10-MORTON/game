<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Mini Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <!-- สคริปต์ยิงพลุ canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    body {
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
    .game-card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
    h1 { color: #38bdf8; font-size: 24px; font-weight: 700; margin-bottom: 2px; }
    p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }

    .cheat-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .cheat-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ตาราง Sudoku 4x4 */
    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #334155;
      padding: 6px;
      border-radius: 12px;
      margin: 0 auto 15px auto;
      width: 260px;
      height: 260px;
    }
    .cell {
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.15s;
    }
    /* แยกบล็อก 2x2 ด้วยขอบ */
    .cell:nth-child(2), .cell:nth-child(10) { margin-right: 3px; }
    .cell:nth-child(n+5):nth-child(-n+8) { margin-bottom: 3px; }
    
    .cell.fixed { background: #1e293b; color: #38bdf8; cursor: default; }
    .cell.selected { border: 2px solid #00ffcc; background: #0f2e3d; }
    .cell.user-filled { color: #ffb703; }
    
    /* สไตล์ลายน้ำเปิดโปร */
    .cell.hint-active::after {
      content: attr(data-solution);
      position: absolute;
      color: rgba(0, 255, 204, 0.45);
      font-size: 14px;
      bottom: 2px;
      right: 4px;
      font-family: 'Kanit', sans-serif;
    }

    /* แผงปุ่มกดตัวเลข */
    .numpad {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .num-btn {
      width: 45px;
      height: 45px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      color: #00ffcc;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: 0.1s;
    }
    .num-btn:hover { background: #38bdf8; color: #0f172a; }
    .num-btn.erase { border-color: #ff007f; color: #ff007f; }

    .btn-action {
      width: 100%;
      padding: 10px;
      background: #00ffcc;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action:hover { background: #00cca3; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🧩 SUDOKU 4x4</h1>
    <p class="desc">เติมตัวเลข 1-4 โดยไม่ให้ซ้ำกันในแถว สลัก และบล็อก 2x2</p>

    <div class="cheat-btn-container">
      <button id="cheat-btn" class="cheat-btn" onclick="toggleCheatMode()">⚡ เปิดโปร (ดูเฉลย)</button>
    </div>

    <!-- ตาราง Sudoku -->
    <div id="board" class="sudoku-board"></div>

    <!-- ปุ่มป้อนตัวเลข -->
    <div class="numpad">
      <button class="num-btn" onclick="inputValue(1)">1</button>
      <button class="num-btn" onclick="inputValue(2)">2</button>
      <button class="num-btn" onclick="inputValue(3)">3</button>
      <button class="num-btn" onclick="inputValue(4)">4</button>
      <button class="num-btn erase" onclick="inputValue(0)">✕</button>
    </div>

    <button class="btn-action" onclick="initGame()">เกมใหม่ 🔄</button>
  </div>

  <script>
    // ชุดข้อมูลโจทย์ (Initial, Solution)
    const puzzles = [
      {
        initial: [1, 0, 0, 4,  0, 0, 0, 0,  0, 0, 0, 0,  3, 0, 0, 2],
        solution:[1, 3, 2, 4,  2, 4, 1, 3,  4, 2, 3, 1,  3, 1, 4, 2]
      },
      {
        initial: [0, 2, 4, 0,  1, 0, 0, 3,  4, 0, 0, 2,  0, 1, 3, 0],
        solution:[3, 2, 4, 1,  1, 4, 2, 3,  4, 3, 1, 2,  2, 1, 3, 4]
      },
      {
        initial: [0, 0, 3, 0,  2, 0, 0, 1,  4, 0, 0, 3,  0, 1, 0, 0],
        solution:[1, 4, 3, 2,  2, 3, 4, 1,  4, 2, 1, 3,  3, 1, 2, 4]
      }
    ];

    let currentPuzzle = {};
    let userBoard = [];
    let selectedIndex = null;
    let isCheatOn = false;

    function toggleCheatMode() {
      isCheatOn = !isCheatOn;
      const btn = document.getElementById('cheat-btn');
      if (isCheatOn) {
        btn.style.background = '#00f2fe';
        btn.style.color = '#000';
        btn.innerText = '⚡ ปิดโปร';
      } else {
        btn.style.background = 'rgba(255, 255, 255, 0.1)';
        btn.style.color = '#00f2fe';
        btn.innerText = '⚡ เปิดโปร (ดูเฉลย)';
      }
      renderBoard();
    }

    function initGame() {
      const pIndex = Math.floor(Math.random() * puzzles.length);
      currentPuzzle = puzzles[pIndex];
      userBoard = [...currentPuzzle.initial];
      selectedIndex = null;
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      userBoard.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        const isFixed = currentPuzzle.initial[idx] !== 0;
        if (isFixed) {
          cell.classList.add('fixed');
          cell.innerText = val;
        } else {
          if (val !== 0) {
            cell.classList.add('user-filled');
            cell.innerText = val;
          }
          cell.onclick = () => selectCell(idx);
          
          // โหมดเปิดโปร (โชว์เฉลยเฉพาะช่องที่ยังไม่ได้ตอบถูก)
          if (isCheatOn && val !== currentPuzzle.solution[idx]) {
            cell.setAttribute('data-solution', currentPuzzle.solution[idx]);
            cell.classList.add('hint-active');
          }
        }

        if (idx === selectedIndex) {
          cell.classList.add('selected');
        }

        board.appendChild(cell);
      });
    }

    function selectCell(idx) {
      selectedIndex = idx;
      renderBoard();
    }

    function inputValue(num) {
      if (selectedIndex === null) return;
      if (currentPuzzle.initial[selectedIndex] !== 0) return; // ห้ามแก้ช่องโจทย์

      userBoard[selectedIndex] = num;
      renderBoard();

      checkWin();
    }

    // ฟังก์ชันยิงพลุเฉลิมฉลอง
    function triggerVictoryFireworks() {
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti({
          ...defaults,
          ...opts,
          particleCount: Math.floor(count * particleRatio)
        });
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#38bdf8', '#00ffcc', '#ffb703', '#ff007f'] });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });

      setTimeout(() => {
        confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 }, shapes: ['star'] });
        confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 }, shapes: ['star'] });
      }, 400);
    }

    function checkWin() {
      const isComplete = userBoard.every((val, idx) => val === currentPuzzle.solution[idx]);
      if (isComplete) {
        triggerVictoryFireworks();
        setTimeout(() => alert('🎉 ยินดีด้วย! คุณแก้ Sudoku สำเร็จแล้ว!'), 300);
      }
    }

    // เริ่มเกมครั้งแรก
    initGame();
  </script>
</body>
</html>
