<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA-Gun Cockpit Defense - Final Polish</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="screen-flash"></div>

    <!-- Cockpit Frame Overlay -->
    <div id="cockpit-frame">
        <div class="canopy-edge top"></div>
        <div class="canopy-edge left"></div>
        <div class="canopy-edge right"></div>
        
        <div class="cockpit-dashboard">
            <div class="dash-screen left-screen">RADAR ACTIVE</div>
            <div class="dash-center-panel">
                <div class="dash-led"></div>
                <div class="dash-label">WEAPON STATUS: READY</div>
            </div>
            <div class="dash-screen right-screen">TARGET ACQUIRED</div>
        </div>
    </div>

    <!-- HUD Elements Layer -->
    <div id="hud-layer">
        <div class="hud-top">
            <div class="hud-box">SCORE: <span id="score-val">0</span></div>
            <div class="hud-box alert">LIVES: <span id="lives-val">❤️❤️❤️</span></div>
            <div class="hud-box">MISSILES: <span id="missile-val">3</span> / 3</div>
        </div>

        <!-- Professional Crosshair Reticle -->
        <div id="crosshair">
            <div class="reticle-outer"></div>
            <div class="reticle-inner"></div>
            <div class="reticle-center-dot"></div>
            <div class="tick top"></div>
            <div class="tick bottom"></div>
            <div class="tick left"></div>
            <div class="tick right"></div>
        </div>

        <!-- Rotating Radar Scope -->
        <div class="radar-container">
            <div class="radar-title">TACTICAL RADAR</div>
            <canvas id="radar-canvas" width="130" height="130"></canvas>
        </div>

        <div class="hud-bottom">
            <span>[A / D] เล็งซ้าย-ขวา | [CLICK] ยิงปืนกล | [SPACEBAR] ยิงมิสไซล์ 🚀</span>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-modal">
        <h1 style="color: #ff3333;">MISSION FAILED</h1>
        <p id="final-score">คะแนนป้องกันฐานของคุณ: 0</p>
        <button onclick="restartGame()">เริ่มภารกิจใหม่ 🛡️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
