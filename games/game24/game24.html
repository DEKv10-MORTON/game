<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24 Game Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    body {
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .game-card {
      background: #1e293b;
      border: 2px solid #00ffcc;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
    }
    h1 { color: #00ffcc; font-size: 26px; margin-bottom: 5px; }
    p.desc { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .num-btn {
      background: #334155;
      border: 2px solid #38bdf8;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      padding: 15px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .num-btn:hover:not(:disabled) { background: #38bdf8; color: #0f172a; transform: scale(1.05); }
    .num-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #475569; }

    /* --- กล่องแสดงผลสมการ & ลายน้ำเฉลย --- */
    .display-box {
      position: relative;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      margin-bottom: 20px;
      color: #00f2fe;
      font-size: 16px;
      font-weight: bold;
    }

    .display-box.hint-active::before {
      content: attr(data-hint);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.18); /* ลายน้ำสีขาวจางกำลังดี ไม่กวนสายตา */
      font-size: 15px;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 1px;
      z-index: 0;
    }

    /* --- ตารางปุ่มเครื่องหมาย --- */
    .operators-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .op-btn {
      background: #1e293b;
      border: 1px solid #ff007f;
      color: #ff007f;
      font-size: 20px;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .op-btn:hover { background: #ff007f; color: #fff; }

    .action-btns {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit { background: #00ffcc; color: #0f172a; }
    .btn-submit:hover { background: #00cca3; }
    .btn-reset { background: #ef4444; color: #fff; }
    .btn-reset:hover { background: #dc2626; }
    .btn-next { background: #3b82f6; color: #fff; width: 100%; margin-top: 10px; display: none; }

    .message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }
    .success { color: #00ffcc; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🎯 GAME 24 CHALLENGE</h1>
    <p class="desc">ใช้ตัวเลขทั้ง 4 ตัวกับเครื่องหมาย เพื่อให้ได้ผลลัพธ์เท่ากับ 24</p>

    <!-- ตัวเลข 4 ตัว -->
    <div class="numbers-grid" id="numbers-container"></div>

    <!-- ปุ่มเปิดโปร ชิดขวาบน -->
    <div style="display: flex; justify-content: flex-end; padding: 0 0 8px 0;">
      <button id="cheat-btn" onclick="toggleCheatMode()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid #00f2fe; color: #00f2fe; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; transition: all 0.2s;">
        ⚡ เปิดโปร (ดูเฉลยจางๆ)
      </button>
    </div>

    <!-- หน้าจอแสดงสมการ -->
    <div class="display-box" id="expression-display">กดเลือกตัวเลขและเครื่องหมาย</div>

    <!-- เครื่องหมายคำนวณ -->
    <div class="operators-grid">
      <button class="op-btn" onclick="addOperator('+')">+</button>
      <button class="op-btn" onclick="addOperator('-')">-</button>
      <button class="op-btn" onclick="addOperator('*')">×</button>
      <button class="op-btn" onclick="addOperator('/')">÷</button>
      <button class="op-btn" onclick="addOperator('(')">(</button>
      <button class="op-btn" onclick="addOperator(')')">)</button>
    </div>

    <!-- ปุ่มควบคุม -->
    <div class="action-btns">
      <button class="btn btn-reset" onclick="resetCurrent()">ล้างคำตอบ</button>
      <button class="btn btn-submit" onclick="checkAnswer()">ตรวจคำตอบ</button>
    </div>
    <button class="btn btn-next" id="next-btn" onclick="generateNewSet()">สุ่มโจทย์ใหม่ ➔</button>

    <div class="message" id="message-box"></div>
  </div>

  <script>
    let targetNumbers = [];
    let usedIndices = [];
    let currentExpression = "";
    let isCheatOn = false;

    // ชุดตัวเลขสุ่มที่มั่นใจว่าทำ 24 ได้จริง
    const presetSets = [
      [1, 2, 3, 4], [3, 8, 3, 1], [4, 4, 4, 6], [2, 3, 4, 6],
      [1, 5, 5, 5], [2, 2, 6, 6], [3, 3, 8, 8], [4, 6, 8, 9],
      [1, 3, 4, 6], [2, 4, 7, 9], [3, 5, 7, 8], [6, 6, 6, 6]
    ];

    function generateNewSet() {
      const randomIndex = Math.floor(Math.random() * presetSets.length);
      targetNumbers = [...presetSets[randomIndex]].sort(() => Math.random() - 0.5);
      resetCurrent();
      renderNumbers();
      document.getElementById('next-btn').style.display = 'none';
      updateCheatDisplay(); 
    }

    function renderNumbers() {
      const container = document.getElementById('numbers-container');
      container.innerHTML = '';
      targetNumbers.forEach((num, idx) => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.id = `num-btn-${idx}`;
        btn.onclick = () => selectNumber(num, idx);
        container.appendChild(btn);
      });
    }

    // --- ⚡ ระบบเปิดโปร (คำนวณเฉลย 24 อัตโนมัติ) ---
    function toggleCheatMode() {
      isCheatOn = !isCheatOn;
      updateCheatDisplay();
    }

    function updateCheatDisplay() {
  const btn = document.getElementById('cheat-btn');
  const exprBox = document.getElementById('expression-display');

  if (!btn || !exprBox) return;

  if (isCheatOn) {
    btn.style.background = '#00f2fe';
    btn.style.color = '#000';
    btn.innerText = '⚡ ปิดโปร';
    
    const solution = solve24Game(targetNumbers);
    if (solution) {
      exprBox.setAttribute('data-hint', solution);
      exprBox.classList.add('hint-active');
      
      // ลบข้อความเริ่มต้นออก เพื่อให้เห็นเฉลยจางๆ ชัดเจน
      if (currentExpression === "") {
        exprBox.innerText = '';
      }
    }
  } else {
    btn.style.background = 'rgba(255, 255, 255, 0.1)';
    btn.style.color = '#00f2fe';
    btn.innerText = '⚡ เปิดโปร (ดูเฉลยจางๆ)';
    exprBox.classList.remove('hint-active');
    
    // คืนค่าข้อความเริ่มต้นถ้ายังไม่ได้พิมพ์อะไร
    if (currentExpression === "") {
      exprBox.innerText = 'กดเลือกตัวเลขและเครื่องหมาย';
    }
  }
}

    // ระบบค้นหาคำตอบ 24 (Math Solver)
    function solve24Game(nums) {
      if (!nums || nums.length < 4) return "";
      
      const ops = ['+', '-', '*', '/'];
      
      function permute(arr) {
        if (arr.length <= 1) return [arr];
        let res = [];
        for (let i = 0; i < arr.length; i++) {
          let rest = permute(arr.slice(0, i).concat(arr.slice(i + 1)));
          for (let r of rest) res.push([arr[i], ...r]);
        }
        return res;
      }

      const permutations = permute(nums);

      for (let p of permutations) {
        let [a, b, c, d] = p;
        for (let o1 of ops) {
          for (let o2 of ops) {
            for (let o3 of ops) {
              let patterns = [
                `(${a} ${o1} ${b}) ${o2} (${c} ${o3} ${d})`,
                `((${a} ${o1} ${b}) ${o2} ${c}) ${o3} ${d}`,
                `(${a} ${o1} (${b} ${o2} ${c})) ${o3} ${d}`,
                `${a} ${o1} ((${b} ${o2} ${c}) ${o3} ${d})`,
                `${a} ${o1} (${b} ${o2} (${c} ${o3} ${d}))`
              ];

              for (let expr of patterns) {
                try {
                  let val = eval(expr);
                  if (Math.abs(val - 24) < 0.0001) {
                    return expr.replace(/\*/g, '×').replace(/\//g, '÷');
                  }
                } catch (e) {}
              }
            }
          }
        }
      }
      return "ไม่มีคำตอบ";
    }

    function selectNumber(num, idx) {
      if (usedIndices.includes(idx)) return;
      usedIndices.push(idx);
      currentExpression += num;
      document.getElementById(`num-btn-${idx}`).disabled = true;
      updateDisplay();
    }

    function addOperator(op) {
      currentExpression += op;
      updateDisplay();
    }

    function updateDisplay() {
      const display = document.getElementById('expression-display');
      display.innerText = currentExpression.replace(/\*/g, '×').replace(/\//g, '÷') || 'กดเลือกตัวเลขและเครื่องหมาย';
    }

    function resetCurrent() {
      currentExpression = "";
      usedIndices = [];
      targetNumbers.forEach((_, idx) => {
        const btn = document.getElementById(`num-btn-${idx}`);
        if (btn) btn.disabled = false;
      });
      updateDisplay();
      document.getElementById('message-box').innerText = '';
    }

    function checkAnswer() {
      const msgBox = document.getElementById('message-box');
      
      if (usedIndices.length < 4) {
        msgBox.className = 'message error';
        msgBox.innerText = '❌ ต้องใช้ตัวเลขให้ครบทั้ง 4 ตัวครับ!';
        return;
      }

      try {
        const result = new Function(`return ${currentExpression}`)();
        
        if (Math.abs(result - 24) < 0.0001) {
          msgBox.className = 'message success';
          msgBox.innerText = '🎉 ถูกต้อง! เก่งมาก ได้ 24 พอดี!';
          document.getElementById('next-btn').style.display = 'block';
        } else {
          msgBox.className = 'message error';
          msgBox.innerText = `❌ ยังไม่ถูก (ได้ผลลัพธ์ = ${Number(result.toFixed(2))})`;
        }
      } catch (e) {
        msgBox.className = 'message error';
        msgBox.innerText = '⚠️ สมการไม่ถูกต้อง ตรวจสอบเครื่องหมายอีกครั้ง';
      }
    }

    // เริ่มเกมครั้งแรก
    generateNewSet();
  </script>
</body>
</html>
